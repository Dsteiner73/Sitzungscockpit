/* Farb- und Schriftreferenz: nw.ch / dist/nw/2025/css/main.3d15b29b05141c1fc2f8.css */
:root{
  color-scheme:light;
  --ink:#000;--muted:#525252;--red:#e40522;--red-dark:#b6041b;
  --white:#fff;--surface:#f8f9fa;--line:#dee2e6;--line-dark:#888;--red-light:#fff1f3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);font:400 1rem/1.5 "Work Sans",Arial,sans-serif;color:var(--ink)}
a{color:var(--red-dark);text-underline-offset:3px}
a:hover{color:#000}
button,input,textarea{font:inherit}
button,summary{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.frame{max-width:1320px;margin:auto;padding:0 36px}
header{border-top:5px solid var(--red);border-bottom:1px solid var(--line);background:var(--white)}
.bar{display:flex;justify-content:space-between;gap:12px;padding:17px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:.875rem}
.bar strong{font-weight:700;color:var(--ink)}
.hero{padding:23px 0 28px;display:flex;justify-content:space-between;gap:20px;align-items:end}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.75rem,4vw,2.8125rem);font-weight:700;line-height:1.15}
.hero p{margin-top:8px}
.hero-links,.nav,.controls{display:flex;flex-wrap:wrap;gap:7px}
.hero-links a,.control{border:1px solid var(--red);background:var(--white);color:var(--red-dark);padding:7px 11px;font-size:.875rem;font-weight:600;text-decoration:none}
.hero-links a:first-child,.control[aria-pressed=true]{background:var(--red);color:var(--white)}
.hero-links a:hover,.control:hover{background:var(--red-dark);border-color:var(--red-dark);color:var(--white)}
main.frame{padding-top:24px;padding-bottom:32px}
.highlight-title{font-size:1.125rem;margin-bottom:10px}
.highlights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.highlights a{background:var(--surface);border-top:3px solid var(--red);padding:10px 12px;color:var(--ink);text-decoration:none;min-height:72px}
.highlights a:hover{background:var(--red-light)}
.highlights a:hover b{text-decoration:underline}
.highlights b,.highlights span{display:block}
.highlights span{color:var(--muted);font-size:.875rem;margin-top:2px}
.workbench{display:grid;grid-template-columns:minmax(290px,.86fr) minmax(0,1.45fr);gap:20px;align-items:start}
.panel{border:1px solid var(--line);background:var(--white);min-width:0}
.index-top{padding:15px;border-bottom:1px solid var(--line);background:var(--surface)}
.index-top h2{font-size:1.25rem;margin-bottom:10px}
.controls{margin-top:9px}
#search,.notes textarea{width:100%;border:1px solid var(--line-dark);background:var(--white);color:var(--ink);padding:8px 10px}
#count,.note-status{font-size:.875rem;color:var(--muted)}
#count{margin-top:8px}
#list{list-style:none;margin:0;padding:0;max-height:68vh;overflow:auto;scrollbar-gutter:stable}
#list li+li{border-top:1px solid var(--line)}
.choose{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:7px;align-items:baseline;width:100%;text-align:left;border:0;border-left:4px solid transparent;background:var(--white);color:var(--ink);padding:10px 10px 10px 12px;min-height:45px;font-size:.9375rem}
.choose:hover{background:var(--surface)}
.choose[aria-current=true]{border-left-color:var(--red);background:var(--red-light)}
.choose:focus-visible{outline-offset:-3px}
.number,.meta,.evidence strong{color:var(--red-dark);font-weight:700}
.number{font-variant-numeric:tabular-nums}
.choose strong{line-height:1.35;font-weight:600}
.motion-count{display:block;font-size:.8rem;color:var(--red-dark);margin-top:2px}
.motion-list{margin:0;padding:0;list-style:none}
.motion-list li{padding:9px 0;border-bottom:1px solid var(--line)}
.motion-list li:last-child{border:0;padding-bottom:2px}
.motion-list p+p{margin-top:3px}
.motion-meta{font-size:.875rem;color:var(--muted)}
.motion-meta a{display:inline-block}
.marker{color:var(--muted);font-size:.8125rem}
.sheet-head{padding:19px 21px 15px;border-bottom:1px solid var(--line);background:var(--surface)}
.meta{font-size:.875rem;margin-bottom:4px}
#detail h2{font-size:clamp(1.5rem,3vw,2rem);line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.summary{margin-top:8px;color:var(--muted);font-weight:600}
.nav{margin-top:12px}
.nav button:disabled{opacity:.5;cursor:default;background:var(--white);color:var(--red-dark)}
.section{padding:13px 21px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section h3{font-size:1rem;margin-bottom:5px;font-weight:700}
.section p+p{margin-top:6px}
.question{background:var(--red-light);box-shadow:inset 3px 0 var(--red)}
.vote{background:var(--surface)}
.vote-head,.note-head{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.evidence{border-left:2px solid var(--line-dark);padding-left:11px;margin-top:9px}
.evidence strong{font-size:.875rem}
.source-list{margin:4px 0 0;padding-left:21px}
.source-list li{margin-top:3px;overflow-wrap:anywhere}
summary,.notes label{font-weight:700}
.notes textarea{min-height:86px;resize:vertical;margin-top:5px}
.notes .control{margin-top:4px}
.note-head label:last-child{white-space:nowrap;font-size:.875rem;font-weight:400}
.note-head input{accent-color:var(--red);margin-right:5px}
#saving{padding:11px 15px;margin:0 0 17px;background:var(--surface)}
#saving summary{font-size:.9375rem}
#save-status{margin-top:5px}
footer{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:20px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}
#status{position:fixed;bottom:12px;right:12px;z-index:5;padding:7px 12px;background:var(--ink);color:var(--white)}
#status:empty,[hidden]{display:none!important}
@media(max-width:900px){
  .frame{padding-inline:22px}
  .highlights{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{align-items:start;flex-direction:column}
  .workbench{grid-template-columns:minmax(230px,.85fr) minmax(0,1.2fr)}
}
@media(max-width:630px){
  .frame{padding-inline:14px}
  .bar{padding-block:11px}
  .hero{padding:17px 0;gap:12px}
  .workbench{grid-template-columns:minmax(0,1fr)}
  #list{max-height:240px}
  .sheet-head,.section{padding-inline:14px}
  footer{display:block}
  footer a{display:inline-block;margin-top:5px}
  .highlights a{min-height:65px;padding:7px 9px}
}
@media print{
  header,footer{border:0}
  .bar,.highlights,.highlight-title,.index,#saving,.hero-links,.nav,.notes .control,#copy,footer{display:none}
  .workbench{display:block}
  .panel{border:0}
  .frame{padding:0}
  .hero{padding:0 0 12px}
  .section{break-inside:avoid}
}
</style>
</head>

<script>
"use strict";
const items = JSON.parse(document.querySelector("#data").textContent);
const search = document.querySelector("#search");
const count = document.querySelector("#count");
const list = document.querySelector("#list");
const detail = document.querySelector("#detail");
const status = document.querySelector("#status");
const storageKey = "landrat-nw-cockpit-2026-11-25-v1";
let selected = "1";
let state = {};
let timer;
const backupName = "Landrat_2026-11-25_Sicherung.json";
const saveStatus = document.querySelector("#save-status");
const knownIds = new Set(items.map(item => item.id));
const pickerTypes = [{description:"Cockpit-Sicherung",accept:{"application/json":[".json"]}}];
let backup = null;
let lastFileText = "";
let pendingWrite = null;
let writes = Promise.resolve();
let browserSaved = false;
let connecting = false;
try {
  state = validState(JSON.parse(localStorage.getItem(storageKey)) || {});
  browserSaved = true;
} catch {}

function validState(entries) {
  if (!entries || typeof entries !== "object" || Array.isArray(entries)) throw Error("Ungültige Einträge.");
  const clean = {};
  for (const [id, value] of Object.entries(entries)) {
    if (!knownIds.has(id) || !value || typeof value !== "object" || Array.isArray(value) ||
        (value.text !== undefined && typeof value.text !== "string") ||
        (value.done !== undefined && typeof value.done !== "boolean")) throw Error("Ungültiges Traktandum.");
    const text = value.text || "";
    const done = value.done === true;
    if (text || done) clean[id] = {text, done};
  }
  return clean;
}
function backupText() {
  return JSON.stringify({format:storageKey, entries:validState(state)}, null, 2) + "\n";
}
function parseBackup(text) {
  const data = JSON.parse(text);
  if (data?.format !== storageKey) throw Error("Sitzung stimmt nicht überein.");
  return validState(data.entries);
}
function saveInBrowser() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
    browserSaved = true;
  } catch { browserSaved = false; }
  return browserSaved;
}
function statusLine(message) {
  saveStatus.textContent = message;
}
function browserMessage() {
  return browserSaved ? "Änderungen werden automatisch in diesem Browser gespeichert."
    : "Browserspeicherung nicht verfügbar. Verbinde eine Sicherungsdatei oder lade eine Sicherung herunter.";
}
function writeBackup() {
  if (!backup) return;
  pendingWrite = backupText();
  statusLine("Sicherungsdatei wird aktualisiert …");
  writes = writes.then(async () => {
    if (!backup || pendingWrite === null) return;
    const next = pendingWrite;
    pendingWrite = null;
    try {
      const actual = await (await backup.getFile()).text();
      if (actual !== lastFileText) throw Error("Sicherungsdatei wurde ausserhalb dieses Cockpits geändert.");
      if (actual !== next) {
        const writer = await backup.createWritable();
        try {
          await writer.write(next);
          await writer.close();
        } catch (error) {
          await writer.abort().catch(() => {});
          throw error;
        }
      }
      lastFileText = next;
      if (pendingWrite === null) statusLine("Gesichert in " + backup.name + ".");
    } catch (error) {
      backup = null;
      statusLine("Dateisicherung unterbrochen. " + browserMessage() + " Lade bei Bedarf eine aktuelle Sicherung herunter.");
    }
  });
}
function downloadBackup() {
  download(backupText(), "application/json", backupName);
  feedback("Sicherung heruntergeladen.");
}
function restore(text) {
  const restored = parseBackup(text);
  const current = validState(state);
  const differs = [...knownIds].some(id =>
    current[id]?.text !== restored[id]?.text || current[id]?.done !== restored[id]?.done);
  if (differs && Object.keys(current).length &&
      !window.confirm("Vorhandene Notizen und Häkchen durch den Stand aus der Sicherung ersetzen?")) return false;
  state = restored;
  saveInBrowser();
  render();
  return true;
}
async function connectBackup(openExisting) {
  if (connecting) return;
  connecting = true;
  try {
    const handle = openExisting
      ? (await window.showOpenFilePicker({types:pickerTypes,multiple:false}))[0]
      : await window.showSaveFilePicker({types:pickerTypes,suggestedName:backupName});
    if (handle.requestPermission && await handle.requestPermission({mode:"readwrite"}) !== "granted") {
      statusLine("Schreibzugriff auf die Sicherungsdatei fehlt. " + browserMessage());
      return;
    }
    await writes;
    const text = await (await handle.getFile()).text();
    if (openExisting) {
      if (!restore(text)) return;
    } else if (text.trim()) {
      statusLine("Die gewählte Datei enthält bereits Daten. Wähle einen neuen Dateinamen oder verbinde die vorhandene Sicherung.");
      return;
    }
    lastFileText = text;
    backup = handle;
    writeBackup();
  } catch (error) {
    if (error.name !== "AbortError") statusLine("Datei konnte nicht verbunden werden. Prüfe das Format oder lade eine Sicherung herunter.");
  } finally { connecting = false; }
}

const newBackup = document.querySelector("#new-backup");
const openBackup = document.querySelector("#open-backup");
const backupInput = document.querySelector("#backup-input");
newBackup.hidden = typeof window.showSaveFilePicker !== "function";
openBackup.hidden = typeof window.showOpenFilePicker !== "function";
newBackup.addEventListener("click", () => connectBackup(false));
openBackup.addEventListener("click", () => connectBackup(true));
document.querySelector("#download-backup").addEventListener("click", downloadBackup);
document.querySelector("#import-backup").addEventListener("click", () => backupInput.click());
backupInput.addEventListener("change", async () => {
  const [file] = backupInput.files;
  backupInput.value = "";
  if (!file) return;
  try {
    if (restore(await file.text())) {
      if (backup) writeBackup();
      else statusLine("Sicherung geladen. " + browserMessage());
    }
  } catch { statusLine("Ungültige Sicherungsdatei für diese Sitzung. Der bisherige Stand bleibt erhalten."); }
});
statusLine(browserMessage());
const draftNote = id => state[id] ?? {};
const normal = text => text.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replaceAll("ß","ss");
const wide = () => matchMedia("(min-width:631px)").matches;

function el(tag, text, klass) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (klass) node.className = klass;
  return node;
}
function link(label,url) {
  const a = el("a",label + (url.startsWith("#") ? "" : " ↗"));
  a.href = url;
  if (!url.startsWith("#")) {
    a.target = "_blank";
    a.rel = "noopener";
  }
  return a;
}
function feedback(text) {
  status.textContent = text;
  clearTimeout(timer);
  timer = setTimeout(() => { status.textContent = ""; }, 2400);
}
function save(id, change) {
  state[id] = {...draftNote(id), ...change};
  saveInBrowser();
  if (backup) writeBackup();
  else statusLine(browserMessage());
  return browserSaved ? "Im Browser gespeichert." :
    "Änderung erfasst. Prüfe den Status unter «Speichern und wiederherstellen».";
}
function visibleItems() {
  const parts = normal(search.value.trim()).split(/\s+/).filter(Boolean);
  return items.filter(item => {
    const fields = [item.id, item.title, item.stage, ...item.links.map(([label]) => label)];
    return parts.every(word => normal(fields.join(" ")).includes(word));
  });
}
function refreshList(visible) {
  list.replaceChildren();
  count.textContent = visible.length === 1 ? "1 Geschäft" : visible.length + " Geschäfte" + (visible.length ? "" : " gefunden");
  for (const item of visible) {
    const li = el("li");
    const button = el("button",null,"choose");
    button.type = "button";
    button.dataset.id = item.id;
    button.setAttribute("aria-current", String(item.id === selected));
    const topic = el("span");
    topic.append(el("strong",item.title));
    button.append(el("span",item.id,"number"), topic,
      el("span",draftNote(item.id).done ? "Erledigt" : draftNote(item.id).text?.trim() ? "Notiz" : "", "marker"));
    button.addEventListener("click", () => choose(item.id, true, true));
    li.append(button);
    list.append(li);
  }
}
function mkButton(label, action) {
  const b = el("button", label, "control");
  b.type = "button";
  b.addEventListener("click", action);
  return b;
}
function exportNotes() {
  const entries = items.filter(item => draftNote(item.id).text?.trim() || draftNote(item.id).done);
  if (!entries.length) { feedback("Noch keine Notizen oder Erledigt-Markierungen."); return; }
  const content = entries.map(item => {
    const saved = draftNote(item.id);
    return item.id + " · " + item.title + (saved.done ? " [Erledigt]" : "") + "\n" + (saved.text || "");
  }).join("\n\n");
  download("Landrat Nidwalden · 25.11.2026\n\n" + content, "text/plain", "Landrat_2026-11-25_Notizen.txt");
}
function download(content, mime, name) {
  const url = URL.createObjectURL(new Blob([content],{type:mime+";charset=utf-8"}));
  const a = el("a");
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}
function renderDetail(item, visible) {
  detail.replaceChildren();
  if (!item) {
    detail.append(el("h2","Keine passenden Geschäfte"), el("p",items.length ? "Passe den Suchbegriff an." : "Die Traktandenliste liegt noch nicht vor."));
    return;
  }
  const head = el("div",null,"sheet-head");
  const title = el("h2",item.title);
  title.tabIndex = -1;
  head.append(el("p",item.id + " · " + item.stage,"meta"),title);
  const current = visible.findIndex(x => x.id === item.id);
  const nav = el("div",null,"nav");
  for (const [offset,label] of [[-1,"‹ Zurück"],[1,"Weiter ›"]]) {
    const next = visible[current+offset];
    const button = mkButton(label, () => choose(next.id,false,true));
    button.disabled = !next;
    nav.append(button);
  }
  head.append(nav);
  detail.append(head);
  const source = el("section",null,"section");
  const docs = el("details");
  docs.open = true;
  docs.append(el("summary","Unterlagen und Verweise ("+item.links.length+")"));
  const ul = el("ul",null,"source-list");
  for(const [label,url] of item.links) {
    const li = el("li");
    li.append(link(label,url));
    ul.append(li);
  }
  docs.append(ul);
  source.append(docs);
  detail.append(source);

  const notes = el("section",null,"section notes");
  const top = el("div",null,"note-head");
  const caption = el("label","Meine Sitzungsnotiz");
  caption.htmlFor = "note";
  const doneLabel = el("label");
  const done = el("input");
  done.type = "checkbox";
  done.checked = draftNote(item.id).done === true;
  doneLabel.append(done,"Erledigt");
  top.append(caption,doneLabel);
  const textarea = el("textarea");
  textarea.id = "note";
  textarea.placeholder = "Beschluss, Rückfrage oder Pendenz";
  textarea.value = draftNote(item.id).text || "";
  const message = el("p","Die Speicherung erfolgt bei jeder Änderung.","note-status");
  textarea.addEventListener("input",()=>{message.textContent = save(item.id,{text:textarea.value});refreshList(visible);});
  done.addEventListener("change",()=>{message.textContent = save(item.id,{done:done.checked});refreshList(visible);});
  notes.append(top,textarea,message,mkButton("Notizen exportieren",exportNotes));
  detail.append(notes);
}
function syncScroll() {
  const active = list.querySelector('[aria-current="true"]');
  if(!active) return;
  if(active.offsetTop - list.firstElementChild.offsetTop < list.scrollTop ||
     active.offsetTop - list.firstElementChild.offsetTop + active.offsetHeight > list.scrollTop + list.clientHeight) {
    list.scrollTop = active.offsetTop - list.firstElementChild.offsetTop - list.clientHeight/2;
  }
}
function render() {
  const visible = visibleItems();
  const selectedItem = visible.find(x=>x.id===selected) || visible[0];
  if (selectedItem) selected = selectedItem.id;
  refreshList(visible);
  renderDetail(selectedItem,visible);
  syncScroll();
}
function setHash(id) {
  const target = "#t-"+id;
  if(location.hash !== target) {
    try { history.replaceState(null,"",target); } catch { location.hash = target; }
  }
}
function choose(id, jumpOnMobile=false, focus=false) {
  const item = items.find(x=>x.id===id);
  if(!item) return;
  if(!visibleItems().some(x=>x.id===id)) {
    search.value = "";
  }
  selected = id;
  setHash(id);
  render();
  if(focus) detail.querySelector("h2")?.focus({preventScroll:true});
  if(jumpOnMobile && !wide()) detail.scrollIntoView({block:"start"});
}
function chooseFromHash() {
  if(location.hash.startsWith("#t-")) choose(location.hash.slice(3),true);
}
search.addEventListener("input",render);
document.addEventListener("click",event=>{
  const anchor = event.target.closest('a[href^="#t-"]');
  if(!anchor) return;
  event.preventDefault();
  choose(anchor.getAttribute("href").slice(3),true,true);
});
window.addEventListener("hashchange",chooseFromHash);
if(location.hash.startsWith("#t-") && items.some(x=>"#t-"+x.id === location.hash)) chooseFromHash();
else render();
</script>
</body>
</html>
